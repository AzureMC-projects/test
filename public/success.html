<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment complete</title><link rel="stylesheet" href="/styles.css"></head><body><main class="success"><div class="box center"><div class="mark">✓</div><div class="eyebrow">PAYMENT COMPLETE</div><h1>Payment received.</h1><p>Your code is generated after Stripe confirms the payment.</p><div class="receipt"><small>Receipt code</small><strong id="code">Checking…</strong></div><a class="button" href="/">Back to shop</a><a class="link" href="/#verify">Receipt checker</a></div></main><script>
const s=new URLSearchParams(location.search).get("session_id"),c=document.getElementById("code");let n=0;async function poll(){n++;if(!s){c.textContent="No session supplied.";return}try{const r=await fetch("/api/check-receipt?session_id="+encodeURIComponent(s)),d=await r.json();if(d.receipt_code){c.textContent=d.receipt_code;return}c.textContent=n<10?"Waiting for confirmation…":"Still processing — check again shortly."}catch{c.textContent="Waiting for confirmation…"}if(n<10)setTimeout(poll,1500)}poll();</script></body></html>
